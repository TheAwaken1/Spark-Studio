description: vLLM serving nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4 without DSpark speculation
model: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
container: vllm-node-tf5
build_args:
  - '--tf5'
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.65
  max_model_len: 262144
  max_num_batched_tokens: 32768
  max_num_seqs: 4
  served_model_name: nemotron-lightning-30b
  override_generation_config: '{"temperature":1.0,"top_p":0.95}'
env:
  VLLM_MARLIN_USE_ATOMIC_ADD: '1'
  TORCH_MATMUL_PRECISION: high
  FLASHINFER_DISABLE_VERSION_CHECK: '1'
  NVIDIA_FORWARD_COMPAT: '1'
  VLLM_HTTP_TIMEOUT_KEEP_ALIVE: '600'
  TZ: Europe/Vienna
command: |
  vllm serve {model} \
    --host {host} \
    --port {port} \
    --served-model-name {served_model_name} \
    --tensor-parallel-size {tensor_parallel} \
    --trust-remote-code \
    --kv-cache-dtype fp8 \
    --moe-backend marlin \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --enable-chunked-prefill \
    --async-scheduling \
    --enable-prefix-caching \
    --mamba-backend flashinfer \
    --mamba-cache-mode align \
    --load-format fastsafetensors \
    --reasoning-parser nemotron_v3 \
    --tool-call-parser qwen3_coder \
    --enable-auto-tool-choice \
    --override-generation-config '{override_generation_config}'
recipe_version: '1'
name: NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
cluster_only: false
runtime: vllm
builder: eugr
solo_only: true
max_nodes: 1
metadata:
  description: Nemotron 3.5 Lightning 30B NVFP4 without DSpark speculative decoding
  model_params: 30B
  model_dtype: nvfp4
  kv_dtype: fp8
  num_layers: 52
  num_kv_heads: 2
  head_dim: 128
  quantization: nvfp4
  quant_bits: 4
