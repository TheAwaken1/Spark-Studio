recipe_version: "2"
model: azampatti/Qwen3.8-Flash-Next-125B-A5B-INT4-AutoRound
runtime: vllm
min_nodes: 1
max_nodes: 1
container: vllm-node-b12x-20261015

metadata:
  description: >-
    Normal safety-aligned variant of azampatti's healed top-k-5 INT4 AutoRound
    Qwen3.8 Flash Next for one DGX Spark. Uses the b12x stack, FP8 disk-backed
    n-gram table, MTP-5 speculative decoding, 262144-token configured context,
    vision, tool calling, and Qwen reasoning.
  maintainer: azampatti upstream; Spark Studio wrapper
  model_params: 125B
  model_dtype: int4
  model_vram: 70
  kv_dtype: bfloat16

mods:
  # Reuse the installed SparkRun-safe mod path. FLASHNEXT_VARIANT=base below
  # bypasses its Orca variant.env and selects the normal cached checkpoint.
  - /home/theawaken/.cache/sparkrun/mods/flashnext-int4-b12x-orca

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  pipeline_parallel: 1
  served_name: azampatti/Qwen3.8-Flash-Next-125B-A5B-INT4-AutoRound
  max_model_len: 262144
  max_num_seqs: 8
  max_num_batched_tokens: 8192
  block_size: 1632
  kv_cache_bytes: 20g
  gpu_memory_utilization: 0.01
  kv_cache_dtype: auto
  num_speculative_tokens: 5
  load_format: fastsafetensors
  chat_template: medium_chat_template.jinja
  temperature: 0.6
  presence_penalty: 0.1

env:
  HF_HUB_OFFLINE: "1"
  FLASHNEXT_VARIANT: "base"
  FLASHNEXT_REPO: /cache/huggingface/hub/models--azampatti--Qwen3.8-Flash-Next-125B-A5B-INT4-AutoRound
  VLLM_WORKER_MULTIPROC_METHOD: "spawn"
  VLLM_SSM_CONV_STATE_LAYOUT: "DS"
  VLLM_USE_AOT_COMPILE: "1"
  VLLM_USE_MEGA_AOT_ARTIFACT: "1"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  B12X_POLICY_MODE: "auto"
  VLLM_ENABLE_ROCE_ALLREDUCE: "1"
  VLLM_ROCE_ALLREDUCE_MAX_SIZE: "2MB"
  VLLM_PLE_TABLE_MEMORY: "disk"
  VLLM_FP8_HYBRID: "1"
  VLLM_MARLIN_USE_ATOMIC_ADD: "1"
  VLLM_USE_DEEP_GEMM: "0"
  VLLM_USE_FLASHINFER_SAMPLER: "1"
  VLLM_MTP_DRAFT_SCALE: "2"

command: |
  SPARKRUN_VALIDATED_MODEL={model} \
  vllm serve /workspace/flashnext/model \
    --served-model-name {served_name} \
    --host {host} \
    --port {port} \
    --trust-remote-code \
    --tensor-parallel-size {tensor_parallel} \
    --pipeline-parallel-size {pipeline_parallel} \
    --enable-expert-parallel \
    --mamba-cache-mode align \
    --recurrent-checkpoint-policy aligned \
    --linear-backend b12x \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --dtype bfloat16 \
    --kv-cache-dtype {kv_cache_dtype} \
    --block-size {block_size} \
    --load-format {load_format} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --kv-cache-memory-bytes {kv_cache_bytes} \
    --gdn-decode-kernel b12x \
    --no-enable-flashinfer-autotune \
    --mm-encoder-tp-mode data \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_coder \
    --reasoning-parser qwen3 \
    --override-generation-config '{"presence_penalty":{presence_penalty},"temperature":{temperature}}' \
    --chat-template /workspace/flashnext/model/{chat_template} \
    --speculative-config '{"method":"mtp","num_speculative_tokens":{num_speculative_tokens},"model":"/workspace/flashnext/draft-k10","rejection_sample_method":"block","draft_sample_method":"greedy"}'

benchmark:
  framework: llama-benchy
  pp: [2048]
  tg: [256]
  depth: [0, 4096]
  prefix_caching: true
